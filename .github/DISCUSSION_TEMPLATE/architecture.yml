title: "[Architecture] "
body:
  - type: markdown
    attributes:
      value: |
        Use this Discussion for significant technical decisions before implementation. Keep only information that affects the decision. Record the final decision in this Discussion instead of duplicating it into another decision document.

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Keep the decision state explicit so reviewers do not confuse a proposal with an approved direction.
      options:
        - Proposed
        - Reviewing
        - Decision Required
        - Approved
        - Rejected
    validations:
      required: true

  - type: input
    id: drafted_by
    attributes:
      label: Drafted By
      description: Identify the human or AI agent/model that produced the initial proposal. Do not overwrite this field merely because another AI later revises or synthesizes the Discussion.
      placeholder: Human | Codex | ChatGPT | Claude | Gemini | Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Context
      description: What problem requires a decision, and why now?
    validations:
      required: true

  - type: textarea
    id: current_architecture
    attributes:
      label: Current Architecture / Current State
      description: Summarize the relevant existing architecture, behavior, boundaries, or data flow using repository evidence.
    validations:
      required: true

  - type: textarea
    id: decision_drivers
    attributes:
      label: Decision Drivers / Constraints
      description: State the requirements, compatibility constraints, tradeoffs, or evaluation criteria that should drive the decision.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Direction
      description: Describe the proposed direction without presenting it as already approved.
    validations:
      required: true

  - type: textarea
    id: target_structure
    attributes:
      label: Target File / Module Structure or Data Flow
      description: Required when repository, package, module, service, component boundaries, or data flow materially change. Otherwise enter N/A.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List credible alternatives, including keeping the current design when relevant.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact / Risks
      description: Summarize material compatibility, migration, rollback, data, security, deployment, performance, operational, or user impact. Omit dimensions that do not matter.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / Open Questions
      description: Link relevant code, benchmarks, docs, incidents, experiments, branches, commits, draft PRs, or unresolved questions.
    validations:
      required: false

  - type: input
    id: approver
    attributes:
      label: Required Approver
      description: Identify the user or maintainer who must approve this direction.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Multi-AI attribution
        `Drafted By` records the initial proposal author. If another AI materially rewrites or synthesizes the proposal, add a Discussion comment beginning with `AI-Contributor: <agent/model>` and `Role: Revision` or `Role: Synthesis`, followed by a concise description of what changed. Do not replace earlier attribution to erase contribution history.

        AI reviews must begin with `AI-Reviewer: <agent/model>`. Add `Review-Focus: <area>` only when the review has a specialized scope. GitHub account identity records the operator; these labels record the actual AI contributor.

        ## Final decision
        When the Discussion converges, set Status to `Approved` or `Rejected` and update the body or add a final comment with the selected direction, core rationale, important rejected alternatives, accepted risks, and `Approved By: <user/maintainer>` when approved. AI drafting, revision, synthesis, review, or implementation is not approval authority. This Discussion is the canonical decision record.
