title: "[Architecture] "
body:
  - type: markdown
    attributes:
      value: |
        Use this Discussion for significant technical decisions before implementation. Keep only information that affects the decision. Record the final decision in this Discussion instead of duplicating it into another decision document.

  - type: input
    id: drafted_by
    attributes:
      label: Drafted By
      description: Identify the human or AI agent/model that drafted or synthesized this proposal. GitHub account identity alone is not sufficient when multiple AI tools operate through the same account.
      placeholder: Human | Codex | ChatGPT | Claude | Gemini | Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Context
      description: What problem requires a decision, and why now?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Direction
      description: Describe the proposed direction without presenting it as already approved.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List credible alternatives, including keeping the current design when relevant.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact / Risks
      description: Summarize the important affected modules, interfaces, data, security, deployment, compatibility, migration, or performance concerns. Omit dimensions that do not matter.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / Open Questions
      description: Link relevant code, benchmarks, docs, incidents, experiments, or unresolved questions.
    validations:
      required: false

  - type: input
    id: approver
    attributes:
      label: Required Approver
      description: Identify the user or maintainer who must approve this direction.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## AI review attribution
        When an AI reviews this Discussion through a shared GitHub account, start the review comment with `AI-Reviewer: <agent/model>`. Add `Review-Focus: <area>` only when the review has a specialized scope. GitHub account identity records the operator; this attribution records the actual AI contributor.

        ## Final decision
        When the Discussion converges, update the body or add a final comment with the selected direction, core rationale, important rejected alternatives, accepted risks, and approver. The approver must be the actual user or maintainer with decision authority; an AI draft or review is not an approval. This Discussion is the canonical decision record.
