name: Architecture implementation
description: Track implementation of an approved Architecture Discussion
title: "architecture: implement "
body:
  - type: markdown
    attributes:
      value: |
        Use this Issue only after the architecture decision has been approved in the linked GitHub Discussion. This Issue tracks execution; do not reopen the architecture debate here.

  - type: input
    id: related_discussion
    attributes:
      label: Related Architecture Discussion
      description: Link the GitHub Discussion containing the approved decision.
      placeholder: https://github.com/OWNER/REPO/discussions/123
    validations:
      required: true

  - type: checkboxes
    id: approval_check
    attributes:
      label: Decision approval
      options:
        - label: The linked Architecture Discussion contains the required approval and final decision.
          required: true

  - type: textarea
    id: scope
    attributes:
      label: Implementation Scope
      description: What exactly must this Issue implement?
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: What related work is intentionally excluded from this Issue?
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define observable conditions that must be true before this Issue can close.
      placeholder: |
        - [ ] Existing behavior remains compatible
        - [ ] New boundary is covered by tests
        - [ ] Required documentation is updated
    validations:
      required: true

  - type: textarea
    id: implementation_plan
    attributes:
      label: Implementation Plan
      description: Break the work into concrete steps. Use sub-issues instead when the work is too large for one Issue.
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
        - [ ] Step 3
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Sequencing
      description: Link prerequisite or blocked Issues and note ordering constraints. Enter N/A if none.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: List implementation-specific risks. Do not repeat the full architecture rationale. Enter None known if none.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: State the tests, checks, build, migration verification, or other evidence required for completion.
    validations:
      required: true
